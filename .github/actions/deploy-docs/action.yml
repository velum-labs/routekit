name: Deploy documentation
description: Stage and promote the RouteKit documentation site on Vercel.

inputs:
  vercel-project:
    description: Existing Vercel project name or ID.
    required: true
  vercel-team:
    description: Vercel team slug or ID that owns the project.
    required: true
  vercel-token:
    description: Vercel token permitted to link, deploy, and promote the project.
    required: true

outputs:
  deployment-url:
    description: URL of the staged and promoted Vercel deployment.
    value: ${{ steps.deploy.outputs.deployment-url }}

runs:
  using: composite
  steps:
    - name: Stage and promote documentation
      id: deploy
      shell: bash
      env:
        VERCEL_DOCS_PROJECT: ${{ inputs.vercel-project }}
        VERCEL_TEAM: ${{ inputs.vercel-team }}
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
      run: |
        set -euo pipefail
        : "${VERCEL_DOCS_PROJECT:?Set the VERCEL_DOCS_PROJECT Actions variable}"
        : "${VERCEL_TEAM:?Set the VERCEL_TEAM Actions variable}"
        : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN Actions secret}"

        vercel_cli() {
          corepack pnpm dlx vercel@58.4.4 "$@" \
            --scope "${VERCEL_TEAM}" \
            --token "${VERCEL_TOKEN}"
        }

        vercel_cli link \
          --yes \
          --team "${VERCEL_TEAM}" \
          --project "${VERCEL_DOCS_PROJECT}"

        deployment_url="$(
          vercel_cli deploy . \
            --yes \
            --prod \
            --skip-domain \
            --force \
            --meta "githubCommitSha=${GITHUB_SHA}" \
            --meta "githubCommitRef=${GITHUB_REF_NAME}"
        )"
        if [[ ! "${deployment_url}" =~ ^https://[^[:space:]]+$ ]]; then
          echo "Vercel did not return a deployment URL: ${deployment_url}" >&2
          exit 1
        fi

        vercel_cli promote "${deployment_url}" --yes
        echo "deployment-url=${deployment_url}" >> "${GITHUB_OUTPUT}"
