name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Pin pnpm
        run: corepack prepare pnpm@11.15.1 --activate

      - name: Install
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "pnpm install failed after ${attempt} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "pnpm install failed; retrying in ${delay}s (attempt $((attempt + 1))/3)" >&2
            sleep "${delay}"
          done

      - name: Restore Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck busybox

      - name: Shellcheck
        run: shellcheck shell/lib/*.sh shell/remote/*.sh shell/install.sh install.sh

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: RouteKit clean-install smoke
        run: node scripts/check-routekit-cli-pack.mjs

      - name: OOTB CLI shape smoke
        run: node scripts/check-ootb-cli.mjs

      - name: Test
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  native-integration-e2e:
    name: persistent native client integration
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Pin pnpm
        run: corepack prepare pnpm@11.15.1 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned native clients
        run: node scripts/install-supported-native-clients.mjs

      - name: Build CLI closure
        run: pnpm build --filter=@velum-labs/routekit

      - name: Prove persistent installs with native clients against a mock upstream
        run: ROUTEKIT_NATIVE_CLIENT_E2E=1 node --test packages/cli/dist/test/native-integration-lifecycle-e2e.test.js

  remote-docker:
    name: remote docker lifecycle
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Pin pnpm
        run: corepack prepare pnpm@11.15.1 --activate

      - name: Install
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "pnpm install failed after ${attempt} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "pnpm install failed; retrying in ${delay}s (attempt $((attempt + 1))/3)" >&2
            sleep "${delay}"
          done

      - name: Restore Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-remote-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-remote-docker-
            ${{ runner.os }}-turbo-

      - name: Build CLI closure
        run: pnpm build:cli

      - name: Remote Docker helper tests
        run: pnpm test:remote:docker:helpers

      - name: Remote Docker lifecycle E2E
        run: pnpm test:remote:docker

      - name: Upload remote Docker diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remote-docker-diagnostics
          path: .artifacts/remote-docker/
          if-no-files-found: ignore
          retention-days: 7
