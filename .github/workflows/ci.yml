name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Pin pnpm
        run: corepack prepare pnpm@10.33.4 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck busybox

      - name: Shellcheck
        run: shellcheck shell/lib/*.sh shell/remote/*.sh shell/install.sh install.sh

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: RouteKit clean-install smoke
        run: node scripts/check-routekit-cli-pack.mjs

      - name: OOTB CLI shape smoke
        run: node scripts/check-ootb-cli.mjs

      - name: Test
        run: pnpm test

      - name: Audit dependencies
        run: |
          npm pkg delete packageManager
          npx --yes pnpm@11 audit --audit-level high
          git checkout -- package.json
