name: Release packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: version or publish npm workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: github.repository == 'velum-labs/routekit'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Pin pnpm
        run: corepack prepare pnpm@11.15.1 --activate

      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: |
          for attempt in 1 2 3; do
            if corepack pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "pnpm install failed after ${attempt} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "pnpm install failed; retrying in ${delay}s (attempt $((attempt + 1))/3)" >&2
            sleep "${delay}"
          done

      - name: Restore Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Create version PR or publish packages
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: corepack pnpm changeset version
          publish: corepack pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Empty by design: npm >=11.5.1 uses this workflow's OIDC identity.
          NPM_TOKEN: ""
          NPM_CONFIG_PROVENANCE: "true"

      - name: Resolve published RouteKit release
        id: routekit-release
        if: ${{ !cancelled() }}
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version="$(node -e 'const raw=process.env.PUBLISHED_PACKAGES; const p=raw ? JSON.parse(raw) : []; process.stdout.write(p.find((x) => x.name === "@velum-labs/routekit")?.version ?? require("./packages/cli/package.json").version)')"
          tag="@velum-labs/routekit@${version}"
          tag_sha="$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "${tag_sha}" ]; then
            tag_sha="$(git ls-remote --tags origin "refs/tags/${tag}" | awk 'NR == 1 { print $1 }')"
          fi
          if [ "${tag_sha}" != "${RELEASE_SHA}" ]; then
            echo "${tag} does not point at this commit; no published RouteKit release to synchronize"
            echo "released=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base_tag="$(git describe --tags --abbrev=0 --match '@velum-labs/routekit@*' HEAD^)"
          {
            echo "released=true"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "base_tag=${base_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Synchronize published release with Linear
        if: ${{ !cancelled() && steps.routekit-release.outputs.released == 'true' }}
        uses: linear/linear-release-action@af56a9a388625921f3757a2f988e4d7aca958377 # v0
        with:
          access_key: ${{ secrets.LINEAR_RELEASE_ACCESS_KEY }}
          name: RouteKit ${{ steps.routekit-release.outputs.version }}
          version: ${{ steps.routekit-release.outputs.version }}
          base_ref: ${{ steps.routekit-release.outputs.base_tag }}
          links: |
            GitHub release=https://github.com/${{ github.repository }}/releases/tag/${{ steps.routekit-release.outputs.tag }}
            npm=https://www.npmjs.com/package/@velum-labs/routekit/v/${{ steps.routekit-release.outputs.version }}

      - name: Upload or repair installer, SBOM, and license artifacts
        if: ${{ !cancelled() && steps.routekit-release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          ROUTEKIT_TAG: ${{ steps.routekit-release.outputs.tag }}
          ROUTEKIT_VERSION: ${{ steps.routekit-release.outputs.version }}
        run: |
          node scripts/generate-shell-scripts.mjs
          corepack pnpm release:artifacts --version "${ROUTEKIT_VERSION}" --source-sha "${RELEASE_SHA}"
          gh release upload "${ROUTEKIT_TAG}" \
            install.sh \
            "release-artifacts/routekit-${ROUTEKIT_VERSION}.spdx.json" \
            "release-artifacts/routekit-${ROUTEKIT_VERSION}-licenses.json" \
            --clobber

      - name: Stage and promote documentation after RouteKit release
        if: ${{ !cancelled() && steps.routekit-release.outputs.released == 'true' }}
        env:
          ROUTEKIT_RELEASE_SHA: ${{ github.sha }}
          VERCEL_DOCS_PROJECT: ${{ vars.VERCEL_DOCS_PROJECT }}
          VERCEL_TEAM: ${{ vars.VERCEL_TEAM }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          : "${VERCEL_DOCS_PROJECT:?Set the VERCEL_DOCS_PROJECT Actions variable}"
          : "${VERCEL_TEAM:?Set the VERCEL_TEAM Actions variable}"
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN Actions secret}"

          vercel_cli() {
            corepack pnpm dlx vercel@58.4.4 "$@" \
              --scope "${VERCEL_TEAM}" \
              --token "${VERCEL_TOKEN}"
          }

          vercel_cli link \
            --yes \
            --team "${VERCEL_TEAM}" \
            --project "${VERCEL_DOCS_PROJECT}"

          deployment_url="$(
            vercel_cli deploy . \
              --yes \
              --prod \
              --skip-domain \
              --force \
              --meta "githubCommitSha=${ROUTEKIT_RELEASE_SHA}" \
              --meta "githubCommitRef=main"
          )"
          if [[ ! "${deployment_url}" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Vercel did not return a deployment URL: ${deployment_url}" >&2
            exit 1
          fi

          vercel_cli promote "${deployment_url}" --yes
