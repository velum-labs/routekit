name: Release packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: version or publish npm workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.repository == 'velum-labs/routekit'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Pin pnpm
        run: corepack prepare pnpm@11.15.1 --activate

      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Create version PR or publish packages
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: corepack pnpm changeset version
          publish: corepack pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Empty by design: npm >=11.5.1 uses this workflow's OIDC identity.
          NPM_TOKEN: ""
          NPM_CONFIG_PROVENANCE: "true"

      - name: Upload installer, SBOM, and license artifacts
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version="$(node -e 'const p=JSON.parse(process.env.PUBLISHED_PACKAGES); process.stdout.write(p.find((x) => x.name === "@velum-labs/routekit")?.version ?? "")')"
          if [ -z "${version}" ]; then
            echo "@velum-labs/routekit was not part of this publish"
            exit 0
          fi
          node scripts/generate-shell-scripts.mjs
          corepack pnpm release:artifacts --version "${version}" --source-sha "${{ github.sha }}"
          gh release upload "@velum-labs/routekit@${version}" \
            install.sh \
            "release-artifacts/routekit-${version}.spdx.json" \
            "release-artifacts/routekit-${version}-licenses.json" \
            --clobber
