packages:
  - "packages/*"
  - "apps/*"

onlyBuiltDependencies:
  - esbuild
  - sharp

overrides:
  "brace-expansion@>=3.0.0 <5.0.8": ">=5.0.8 <6"
  "postcss@<=8.5.17": ">=8.5.18"
  "sharp@<0.35.0": ">=0.35.0"
  "undici@>=7.0.0 <7.28.0": ">=7.28.0 <8"

# Optional SDK peers used by tool integrations; exercised only when the host
# installs those CLIs. Keep them out of the default trust surface.
peerDependencyRules:
  ignoreMissing:
    - "@anthropic-ai/claude-agent-sdk"
    - "@anthropic-ai/sdk"
    - "@modelcontextprotocol/sdk"

catalog:
  "@anthropic-ai/claude-agent-sdk": 0.3.198
